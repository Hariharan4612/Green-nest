server:
  port: 4000

spring:
  application:
    name: nfarm-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nfarm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:hari1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: false

logging:
  level:
    org.springframework.web: INFO
    com.nfarm: INFO
